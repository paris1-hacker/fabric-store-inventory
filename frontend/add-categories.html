```html
<!-- Add Category Modal -->
<div
    class="modal fade"
    id="addCategoryModal"
    tabindex="-1"
    aria-labelledby="addCategoryModalLabel"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <div>
                    <h5
                        class="modal-title"
                        id="addCategoryModalLabel"
                    >
                        Add Category
                    </h5>

                    <small class="text-muted">
                        Create a new fabric category
                    </small>
                </div>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>


            <form id="addCategoryForm">

                <div class="modal-body">

                    <!-- Category Name -->
                    <div class="mb-3">

                        <label
                            for="categoryName"
                            class="form-label"
                        >
                            Category Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="categoryName"
                            name="name"
                            placeholder="e.g. Cotton"
                            maxlength="100"
                            required
                        >

                    </div>


                    <!-- Description -->
                    <div class="mb-3">

                        <label
                            for="categoryDescription"
                            class="form-label"
                        >
                            Description
                        </label>

                        <textarea
                            class="form-control"
                            id="categoryDescription"
                            name="description"
                            rows="4"
                            placeholder="Describe this category..."
                        ></textarea>

                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-light"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="saveCategoryButton"
                    >
                        <i class="bi bi-plus-lg me-2"></i>
                        Add Category
                    </button>

                </div>

            </form>

        </div>

    </div>
</div>
```
