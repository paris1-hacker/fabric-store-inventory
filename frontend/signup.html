<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up | FabricStore</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <!-- BRAND -->

            <div class="login-brand">

                <div class="brand-logo">
                    <i class="bi bi-box-seam"></i>
                </div>

                <div>
                    <h2>FabricStore</h2>
                    <p>Inventory Management</p>
                </div>

            </div>


            <!-- HEADER -->

            <div class="login-header">

                <h1>Create your account</h1>

                <p>
                    Create an account to manage fabric inventory.
                </p>

            </div>


            <!-- ERROR -->

            <div
                id="signupError"
                class="alert alert-danger d-none"
                role="alert"
            ></div>


            <!-- SUCCESS -->

            <div
                id="signupSuccess"
                class="alert alert-success d-none"
                role="alert"
            ></div>


            <!-- FORM -->

            <form id="signupForm">

                <!-- NAME -->

                <div class="mb-3">

                    <label
                        for="name"
                        class="form-label"
                    >
                        Full name
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>

                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="mb-3">

                    <label
                        for="signupEmail"
                        class="form-label"
                    >
                        Email address
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input
                            type="email"
                            class="form-control"
                            id="signupEmail"
                            placeholder="you@example.com"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="mb-3">

                    <label
                        for="signupPassword"
                        class="form-label"
                    >
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                            type="password"
                            class="form-control"
                            id="signupPassword"
                            placeholder="At least 6 characters"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="btn password-toggle"
                            id="toggleSignupPassword"
                        >
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- ROLE -->

                <div class="mb-4">

                    <label
                        for="role"
                        class="form-label"
                    >
                        Role
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-shield-check"></i>
                        </span>

                        <select
                            class="form-select"
                            id="role"
                        >
                            <option value="STAFF" selected>
                                Staff
                            </option>

                            <option value="ADMIN">
                                Administrator
                            </option>
                        </select>

                    </div>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="btn btn-primary login-button"
                    id="signupButton"
                >

                    <span id="signupButtonText">
                        Create account
                    </span>

                    <span
                        id="signupSpinner"
                        class="spinner-border spinner-border-sm d-none"
                    ></span>

                </button>

            </form>


            <!-- LOGIN LINK -->

            <div class="login-footer">

                <div class="mb-2">
                    Already have an account?
                </div>

                <a
                    href="login.html"
                    class="view-link justify-content-center"
                >
                    Sign in
                    <i class="bi bi-arrow-right"></i>
                </a>

            </div>

        </section>

    </main>


    <script src="js/api.js"></script>
    <script src="js/signup.js"></script>

</body>

</html>
